name: Bug report
description: A patch, the settings or a review does not do what the README says it does.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Two things that are not bugs and need no issue:

        - **Sign in with Google, Facebook or Apple** never works in a patched app. Add an email and a password to the account and log in with them, as described in the README.
        - A new bundle in Morphe does not change an app that is already installed. The APK has to be patched and installed again after the update.

  - type: dropdown
    id: chess-version
    attributes:
      label: chess.com version
      options:
        - 4.10.28
        - 4.10.27
        - Other (written below)
    validations:
      required: true

  - type: input
    id: manager-version
    attributes:
      label: Morphe Manager version
      description: Shown in Morphe under Settings, About. Optional.
      placeholder: 2.3.0
    validations:
      required: false

  - type: textarea
    id: patches
    attributes:
      label: Patches selected
      description: The list Morphe showed before patching, or at least the patches that matter here.
      placeholder: |
        Unlimited Game Review
        Game Review on your computer
        Great and Brilliant moves analysis
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: What you did
      description: The shortest way to get there, starting from opening the app.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: A screenshot of the screen, or a logcat excerpt around the moment it goes wrong. Optional, but it usually saves a round of questions.
      render: text
    validations:
      required: false

  - type: input
    id: device
    attributes:
      label: Device
      description: The model is enough - the Android version and the ROM are not needed.
      placeholder: Pixel 7
    validations:
      required: true
